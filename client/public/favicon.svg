<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4338ca" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Modern Lightning Zap Symbol (PrepSense Brand) -->
  <path
    d="M35 8L16 34H31L27 56L48 28H33L35 8Z"
    fill="url(#boltGrad)"
    filter="url(#glow)"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Subtle AI Glowing Node -->
  <circle cx="49" cy="15" r="4.5" fill="#38bdf8" />
  <circle cx="49" cy="15" r="2.5" fill="#ffffff" />
</svg>
